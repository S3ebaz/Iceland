<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISLAND - Mapa Épico Interactivo</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a1628;
      color: #e8f0f8;
      height: 100vh;
      overflow: hidden;
    }
    #map { height: 100vh; width: 100%; background: #1a2a3a; }
    .title-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(10, 22, 40, 0.88);
      padding: 12px 24px;
      border-radius: 8px;
      border: 1px solid #4a90a4;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .title-overlay h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
      color: #c9e8ff;
      text-shadow: 0 0 10px #4a90a4;
    }
    .title-overlay p { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
    .leaflet-popup-content-wrapper {
      background: #0f1f33;
      color: #e8f0f8;
      border-radius: 10px;
      border: 1px solid #4a90a4;
      max-width: 340px;
    }
    .leaflet-popup-tip { background: #0f1f33; }
    .popup-content h3 { color: #7ec8e3; margin: 0 0 8px 0; }
    .popup-content .temp { color: #a8d5e5; font-weight: bold; margin: 6px 0; }
    .popup-content .epic { color: #ffd700; font-style: italic; margin: 6px 0; }
    .popup-content .source { color: #b8a0ff; margin: 8px 0 4px 0; font-size: 0.9rem; border-top: 1px solid #4a90a4; padding-top: 6px; }
    .popup-images {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .popup-images img {
      width: 48%;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #4a90a4;
    }
    .popup-images .label {
      font-size: 0.7rem;
      text-align: center;
      opacity: 0.8;
      margin-top: 2px;
    }
    .legend {
      position: absolute;
      bottom: 30px;
      right: 20px;
      z-index: 1000;
      background: rgba(10, 22, 40, 0.92);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #4a90a4;
      font-size: 0.85rem;
      min-width: 180px;
    }
    .legend strong { display: block; margin-bottom: 10px; color: #c9e8ff; }
    .legend-item { display: flex; align-items: center; gap: 10px; margin: 7px 0; }
    .legend-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #fff;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="title-overlay">
    <h1>ISLAND</h1>
    <p>Mapa épico interactivo • Haz clic en los marcadores</p>
  </div>

  <div id="map"></div>

  <div class="legend">
    <strong>Leyenda</strong>
    <div class="legend-item"><div class="legend-dot" style="background:#3b82f6;"></div> Ciudad</div>
    <div class="legend-item"><div class="legend-dot" style="background:#67e8f9;"></div> Glaciar</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbbf24;"></div> Punto épico</div>
    <div class="legend-item"><div class="legend-dot" style="background:#34d399;"></div> Región</div>
  </div>

  <script>
    // v3 - colored icons + images
    const map = L.map('map', {
      center: [64.9, -18.5],
      zoom: 6,
      minZoom: 5,
      maxZoom: 12
    });

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 19
    }).addTo(map);

    function makeIcon(color) {
      return L.divIcon({
        className: '',
        html: `<div style="background:${color};width:22px;height:22px;border-radius:50%;border:3px solid white;box-shadow:0 0 8px rgba(0,0,0,0.6);"></div>`,
        iconSize: [22, 22],
        iconAnchor: [11, 11],
        popupAnchor: [0, -12]
      });
    }

    const icons = {
      city: makeIcon('#3b82f6'),
      glacier: makeIcon('#67e8f9'),
      epic: makeIcon('#fbbf24'),
      region: makeIcon('#34d399')
    };

    fetch('data/locations.json?v=3')
      .then(r => r.json())
      .then(locations => {
        locations.forEach(loc => {
          const icon = icons[loc.type] || icons.city;
          const marker = L.marker([loc.lat, loc.lng], { icon }).addTo(map);

          const imgHtml = (loc.image || loc.movie_image) ? `
            <div class="popup-images">
              ${loc.image ? `<div><img src="${loc.image}" alt="Ubicación" onerror="this.style.display='none'"><div class="label">Ubicación</div></div>` : ''}
              ${loc.movie_image ? `<div><img src="${loc.movie_image}" alt="Película" onerror="this.style.display='none'"><div class="label">Película / Serie</div></div>` : ''}
            </div>` : '';

          marker.bindPopup(`
            <div class="popup-content">
              <h3>${loc.name}</h3>
              <p>${loc.description}</p>
              <p class="temp">🌡️ Verano: ${loc.temp_summer} | Invierno: ${loc.temp_winter}</p>
              ${loc.epic ? `<p class="epic">✨ ${loc.epic}</p>` : ''}
              ${loc.source ? `<p class="source">🎬 ${loc.source}</p>` : ''}
              ${imgHtml}
            </div>
          `);
        });
      })
      .catch(err => console.error(err));
  </script>
</body>
</html>
